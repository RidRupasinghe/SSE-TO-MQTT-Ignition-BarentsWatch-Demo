services:
  mqtt:
    build: ./mqtt
    restart: unless-stopped
    env_file:
      - ./bridge/.env
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t _healthcheck -m ok -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  bridge:
    build: ./bridge
    restart: unless-stopped
    init: true
    env_file:
      - ./bridge/.env
    environment:
      MQTT_BROKER_URL: mqtt://mqtt:1883
      CONNECTIONS_CONFIG: /app/config/connections.json
    volumes:
      - ./bridge/config:/app/config:ro
    depends_on:
      mqtt:
        condition: service_healthy
    stop_grace_period: 20s

  ignition:
    image: inductiveautomation/ignition:8.3.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:9088:8088"
      - "127.0.0.1:9043:8043"
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      TZ: Europe/Stockholm
    command: >
      -n ais-ignition
      -a localhost
      -h 9088
      -s 9043
      -m 2048
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./ignition/projects:/usr/local/bin/ignition/data/projects
    depends_on:
      mqtt:
        condition: service_healthy
    stop_grace_period: 60s

volumes:
  mqtt-data:
  ignition-data:
